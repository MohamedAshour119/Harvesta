<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" fill="none">
  <defs>
    <!-- Vibrant Gold Gradient -->
    <linearGradient id="h-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Vivid Crimson Gradient -->
    <linearGradient id="h-crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5255"/>
      <stop offset="50%" stop-color="#E03E41"/>
      <stop offset="100%" stop-color="#B12C2E"/>
    </linearGradient>

    <!-- Lush Emerald Gradient -->
    <linearGradient id="h-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="h-glow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#E03E41" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Emblem Icon (Larger, High Contrast, Bold Shapes) -->
  <g transform="translate(6, 4)" filter="url(#h-glow)">
    <!-- Outer Shield Crest -->
    <path d="M34 2 C52 2, 66 16, 66 35 C66 54, 44 65, 34 68 C24 65, 2 54, 2 35 C2 16, 16 2, 34 2 Z" 
          fill="none" stroke="url(#h-crimson)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Central Harvest Crown / Golden Grain -->
    <path d="M34 11 Q46 22 34 36 Q22 22 34 11 Z" fill="url(#h-gold)"/>
    
    <!-- Lower Crimson Flourish -->
    <path d="M34 31 Q48 41 38 54 Q28 43 34 31 Z" fill="url(#h-crimson)"/>
    
    <!-- Left & Right Emerald Growth Leaves -->
    <path d="M21 25 Q32 30 28 41 Q17 35 21 25 Z" fill="url(#h-emerald)"/>
    <path d="M47 25 Q36 30 40 41 Q51 35 47 25 Z" fill="url(#h-emerald)"/>
    
    <!-- Radiant Sun Pearl -->
    <circle cx="34" cy="15" r="3.5" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- Typography: Bold, Large & Crystal Clear -->
  <g transform="translate(86, 44)">
    <!-- HARVESTA Main Title -->
    <text x="0" y="0" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="40" font-weight="900" letter-spacing="1.2" fill="url(#h-crimson)">
      HARVESTA
    </text>
    
    <!-- Slogan Pill Badge / Subtitle -->
    <g transform="translate(2, 8)">
      <rect x="0" y="0" width="246" height="18" rx="5" fill="rgba(224,62,65,0.1)"/>
      <text x="7" y="13" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" letter-spacing="1.6" fill="#F59E0B">
        B2B FOOD &amp; SUPPLY NETWORK
      </text>
    </g>
  </g>
</svg>