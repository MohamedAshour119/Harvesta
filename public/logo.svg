<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 306 70" fill="none">
  <defs>
    <!-- Vibrant Gold Gradient -->
    <linearGradient id="h-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Vivid Crimson Gradient -->
    <linearGradient id="h-crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5255"/>
      <stop offset="50%" stop-color="#E03E41"/>
      <stop offset="100%" stop-color="#B12C2E"/>
    </linearGradient>

    <!-- Lush Emerald Gradient -->
    <linearGradient id="h-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="h-glow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#E03E41" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Emblem Icon -->
  <g transform="translate(4, 2)" filter="url(#h-glow)">
    <!-- Outer Shield Crest -->
    <path d="M33 2 C50 2, 64 16, 64 34 C64 53, 42 63, 33 66 C24 63, 2 53, 2 34 C2 16, 16 2, 33 2 Z" 
          fill="none" stroke="url(#h-crimson)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Central Harvest Crown / Golden Grain -->
    <path d="M33 11 Q44 21 33 35 Q22 21 33 11 Z" fill="url(#h-gold)"/>
    
    <!-- Lower Crimson Flourish -->
    <path d="M33 30 Q46 40 37 53 Q28 42 33 30 Z" fill="url(#h-crimson)"/>
    
    <!-- Left & Right Emerald Growth Leaves -->
    <path d="M20 24 Q31 29 27 40 Q17 34 20 24 Z" fill="url(#h-emerald)"/>
    <path d="M46 24 Q35 29 39 40 Q49 34 46 24 Z" fill="url(#h-emerald)"/>
    
    <!-- Radiant Sun Pearl -->
    <circle cx="33" cy="14" r="3.5" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- Typography -->
  <g transform="translate(78, 41)">
    <!-- HARVESTA Main Title: Fully visible letter A with perfect clearance -->
    <text x="0" y="0" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="39" font-weight="900" letter-spacing="1.2" fill="url(#h-crimson)">HARVESTA</text>
    
    <!-- Slogan Subtitle -->
    <g transform="translate(1, 8)">
      <rect x="0" y="0" width="220" height="17" rx="4.5" fill="rgba(224,62,65,0.1)"/>
      <text x="6" y="12.5" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.2" font-weight="800" letter-spacing="1.1" fill="#F59E0B">B2B FOOD &amp; SUPPLY NETWORK</text>
    </g>
  </g>
</svg>